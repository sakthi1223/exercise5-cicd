name: CI/CD Automated Pipeline to Azure

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies and Run Tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest

      - name: Log into Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io
          IMAGE_NAME: microservice-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG -t $REGISTRY/$IMAGE_NAME:latest .
          docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          docker push $REGISTRY/$IMAGE_NAME:latest

      - name: Deploy Image to Container App
        env:
          ACR_NAME: ${{ secrets.AZURE_REGISTRY_NAME }}
          ACR_USER: ${{ secrets.REGISTRY_USERNAME }}
          ACR_PASS: ${{ secrets.REGISTRY_PASSWORD }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ secrets.AZURE_APP_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp registry set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --server "$ACR_NAME.azurecr.io" \
            --username "$ACR_USER" \
            --password "$ACR_PASS"
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/microservice-app:$IMAGE_TAG"
